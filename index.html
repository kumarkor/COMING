<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure OTP Verification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; width: 90%; max-width: 350px; position: relative; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: linear-gradient(90deg, #f59e0b, #d97706); border-top-left-radius: 20px; border-top-right-radius: 20px; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { margin: 0 0 10px 0; font-size: 22px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .otp-input { width: 80%; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 10px; border-radius: 10px; border: 2px solid #3b82f6; background: #0f172a; color: #38bdf8; outline: none; margin-bottom: 20px; font-weight: bold; }
        .otp-input:focus { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        
        .btn { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-bottom: 10px; }
        .btn:hover { transform: scale(1.05); }
        .btn-success { background: linear-gradient(90deg, #10b981, #059669); display: none; }
        
        #errorMsg { color: #ef4444; font-size: 13px; margin-bottom: 15px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" id="statusIcon">🔐</div>
        <h2 id="title">Enter OTP Code</h2>
        <p id="desc">Please enter the 4-digit code sent to you by the bot.</p>
        
        <input type="number" id="otpBox" class="otp-input" placeholder="0000" maxlength="4" oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);">
        
        <div id="errorMsg"></div>
        
        <button class="btn" id="verifyBtn" onclick="verifyOTP()">Verify Device</button>
        <button class="btn btn-success" id="closeBtn" onclick="closeApp()">✅ Return to Bot</button>
    </div>

    <script>
        const uid = new URLSearchParams(window.location.search).get('uid');
        let realOtp = "";

        // 1. Fetch the real OTP from Firestore when app opens
        async function fetchRealOTP() {
            if (!uid) { showError("UID Missing! Open from Bot."); return; }
            try {
                let res = await fetch(`https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}`);
                let data = await res.json();
                if (data && data.fields && data.fields.otp) {
                    realOtp = data.fields.otp.stringValue;
                }
            } catch (e) { showError("Network error connecting to database."); }
        }
        fetchRealOTP();

        function showError(msg) {
            document.getElementById("errorMsg").innerText = msg;
        }

        async function verifyOTP() {
            let userOtp = document.getElementById("otpBox").value;
            if (userOtp.length < 4) { showError("Please enter a valid 4-digit OTP."); return; }
            if (userOtp !== realOtp) { showError("❌ Incorrect OTP! Try again."); return; }

            document.getElementById("verifyBtn").innerText = "Checking Security...";
            document.getElementById("verifyBtn").disabled = true;

            // 2. ANTI-CHEAT: 1 Device = 1 User Check
            let deviceId = localStorage.getItem("bot_secure_device");
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem("bot_secure_device", deviceId);
            }

            const queryUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents:runQuery`;
            const queryPayload = {
                structuredQuery: {
                    from: [{ collectionId: "users" }],
                    where: { fieldFilter: { field: { fieldPath: "deviceId" }, op: "EQUAL", value: { stringValue: deviceId } } }
                }
            };

            try {
                let checkRes = await fetch(queryUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(queryPayload) });
                let checkData = await checkRes.json();
                let isUsedByOther = false;
                
                if (checkData && checkData.length > 0) {
                    for (let item of checkData) {
                        if (item.document && item.document.name) {
                            let existingUid = item.document.name.split('/').pop();
                            if (existingUid !== uid) { isUsedByOther = true; break; }
                        }
                    }
                }

                if (isUsedByOther) {
                    showError("🚫 MULTIPLE ACCOUNTS DETECTED! Device Banned.");
                    document.getElementById("statusIcon").innerText = "❌";
                    // Ban logic in Firebase
                    await fetch(`https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}?updateMask.fieldPaths=device_verified`, {
                        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fields: { device_verified: { booleanValue: false } } })
                    });
                    return;
                }

                // 3. SUCCESS: Save Verified Status
                const firestoreUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}?updateMask.fieldPaths=deviceId&updateMask.fieldPaths=device_verified&updateMask.fieldPaths=otp`;
                let updateRes = await fetch(firestoreUrl, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            deviceId: { stringValue: deviceId },
                            device_verified: { booleanValue: true },
                            otp: { stringValue: "USED" } // Expire the OTP
                        }
                    })
                });

                if (updateRes.ok) {
                    document.getElementById("statusIcon").innerText = "✅";
                    document.getElementById("title").innerText = "Verification Complete!";
                    document.getElementById("desc").innerText = "Your OTP matched and device is secured.";
                    document.getElementById("errorMsg").innerText = "";
                    document.getElementById("otpBox").style.display = "none";
                    document.getElementById("verifyBtn").style.display = "none";
                    document.getElementById("closeBtn").style.display = "block";
                }
            } catch (e) { showError("Database Error. Please retry."); document.getElementById("verifyBtn").disabled = false; document.getElementById("verifyBtn").innerText = "Verify Device"; }
        }

        function closeApp() { if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close(); }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
