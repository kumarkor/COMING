<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; flex-direction: column;}
        .card { background: rgba(30, 41, 59, 0.9); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; width: 90%; max-width: 350px; border-top: 5px solid #38bdf8; backdrop-filter: blur(10px); position: relative; margin-bottom: 20px;}
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { margin: 0 0 10px 0; font-size: 22px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        .otp-input { display: none; width: 80%; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 15px; border-radius: 10px; border: 2px solid #3b82f6; background: #0f172a; color: #38bdf8; outline: none; margin: 0 auto 20px auto; font-weight: bold; transition: 0.3s; }
        .otp-input:focus { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
        
        .btn { background: linear-gradient(90deg, #3b82f6, #2563eb); color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
        .btn:hover { transform: scale(1.05); }
        
        #errorMsg { color: #ef4444; font-size: 14px; margin-bottom: 15px; font-weight: bold; min-height: 20px; }

        /* Admin Panel Style */
        .admin-panel { display: none; background: #334155; padding: 15px; border-radius: 15px; border: 2px dashed #ef4444; width: 90%; max-width: 350px; text-align: center;}
        .admin-btn { background: #ef4444; color: white; border: none; padding: 10px; font-size: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;}
        .admin-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    
    <div class="card">
        <div class="icon" id="statusIcon">🛡️</div>
        <h2 id="title">Device Security</h2>
        <p id="desc">Click below to receive a secure OTP in your Telegram chat.</p>
        
        <input type="number" id="otpBox" class="otp-input" placeholder="0000" maxlength="4" oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);">
        
        <div id="errorMsg"></div>
        
        <button class="btn" id="sendBtn" onclick="requestOTP()">📩 Get OTP on Telegram</button>
        <button class="btn" id="verifyBtn" style="display: none; background: linear-gradient(90deg, #f59e0b, #d97706);" onclick="checkOTP()">✅ Verify OTP</button>
        <button class="btn" id="closeBtn" style="display: none; background: linear-gradient(90deg, #10b981, #059669);" onclick="closeApp()">Return to Bot</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <h3 style="margin: 0; color: #f87171; font-size: 16px;">🛠️ Admin Controls</h3>
        <button class="admin-btn" onclick="resetAdminData()">🗑️ Reset My Data (For Testing)</button>
    </div>

    <script>
        const uid = new URLSearchParams(window.location.search).get('uid');
        const adminId = "7335163273"; // Tuza Admin ID
        const botToken = "8820903723:AAHcsIeGc84J2xaLK8-VCF7grrQXhsciQAw";
        let generatedOtp = "";
        let deviceId = localStorage.getItem("bot_secure_device");

        if (!deviceId) {
            deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
            localStorage.setItem("bot_secure_device", deviceId);
        }

        // Admin check: Show admin panel if UID matches
        if (uid === adminId) {
            document.getElementById("adminPanel").style.display = "block";
        }

        function showError(msg) { document.getElementById("errorMsg").innerText = msg; }

        async function requestOTP() {
            if (!uid) { showError("UID Missing! Open from Bot."); return; }
            document.getElementById("sendBtn").innerText = "⏳ Checking Security...";
            document.getElementById("sendBtn").disabled = true;

            // ANTI-CHEAT: Check 1 Device = 1 User
            const queryUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents:runQuery`;
            const queryPayload = {
                structuredQuery: {
                    from: [{ collectionId: "users" }],
                    where: { fieldFilter: { field: { fieldPath: "deviceId" }, op: "EQUAL", value: { stringValue: deviceId } } }
                }
            };

            try {
                let checkRes = await fetch(queryUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(queryPayload) });
                let checkData = await checkRes.json();
                let isUsedByOther = false;
                
                if (checkData && checkData.length > 0) {
                    for (let item of checkData) {
                        if (item.document && item.document.name) {
                            let existingUid = item.document.name.split('/').pop();
                            if (existingUid !== uid) { isUsedByOther = true; break; }
                        }
                    }
                }

                if (isUsedByOther) {
                    showError("🚫 MULTIPLE ACCOUNTS DETECTED!\nThis device is banned.");
                    document.getElementById("statusIcon").innerText = "❌";
                    document.getElementById("sendBtn").style.display = "none";
                    return;
                }

                // Generate and Send OTP
                generatedOtp = Math.floor(1000 + Math.random() * 9000).toString();
                let tgMsg = `🔐 *SECURITY VERIFICATION*\n\nYour OTP Code is: \`${generatedOtp}\`\n\n_Please enter this code in the Web App to verify your device._`;
                
                let tgUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${uid}&text=${encodeURIComponent(tgMsg)}&parse_mode=Markdown`;
                await fetch(tgUrl);

                // Update UI
                document.getElementById("statusIcon").innerText = "💬";
                document.getElementById("title").innerText = "OTP Sent!";
                document.getElementById("desc").innerText = "Check your Telegram chat and enter the 4-digit code below.";
                document.getElementById("sendBtn").style.display = "none";
                document.getElementById("otpBox").style.display = "block";
                document.getElementById("verifyBtn").style.display = "block";
                showError("");

            } catch (e) { 
                showError("Network Error!"); 
                document.getElementById("sendBtn").innerText = "📩 Get OTP on Telegram"; 
                document.getElementById("sendBtn").disabled = false; 
            }
        }

        async function checkOTP() {
            let userOtp = document.getElementById("otpBox").value;
            if (userOtp.length < 4) { showError("Enter 4-digit OTP."); return; }
            if (userOtp !== generatedOtp) { showError("❌ Incorrect OTP! Try again."); return; }

            document.getElementById("verifyBtn").innerText = "⏳ Saving...";
            document.getElementById("verifyBtn").disabled = true;

            // Save Verified Status
            const firestoreUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}?updateMask.fieldPaths=deviceId&updateMask.fieldPaths=device_verified`;
            try {
                let updateRes = await fetch(firestoreUrl, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields: { deviceId: { stringValue: deviceId }, device_verified: { booleanValue: true } } })
                });

                if (updateRes.ok) {
                    document.getElementById("statusIcon").innerText = "✅";
                    document.getElementById("title").innerText = "Verification Complete!";
                    document.getElementById("desc").innerText = "Your device is secured successfully.";
                    document.getElementById("otpBox").style.display = "none";
                    document.getElementById("verifyBtn").style.display = "none";
                    document.getElementById("closeBtn").style.display = "block";
                    showError("");
                }
            } catch (e) { showError("Database Error."); }
        }

        // ADMIN FUNCTION: DELETE FIREBASE DATA & LOCAL STORAGE
        async function resetAdminData() {
            let confirmDelete = confirm("Are you sure you want to delete your verification data to test again?");
            if (!confirmDelete) return;

            try {
                // Delete user from Firebase via Website directly (Works 100%!)
                let deleteUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}`;
                await fetch(deleteUrl, { method: 'DELETE' });

                // Remove Local Storage Device ID
                localStorage.removeItem("bot_secure_device");

                alert("✅ Data Deleted Successfully! Please close this app, go to bot and send /start to test again.");
                closeApp();
            } catch (e) {
                alert("Error deleting data!");
            }
        }

        function closeApp() { if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close(); }
    </script>
</body>
</html>
