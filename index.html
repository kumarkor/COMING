<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .container { background: #1e293b; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); max-width: 400px; width: 90%; border-top: 4px solid #38bdf8; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #f8fafc; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: none; background: #10b981; color: #ffffff; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon" id="statusIcon">⏳</div>
        <h2 id="statusTitle">Verifying Device...</h2>
        <p id="statusMessage">Please wait while we securely verify your device.</p>
        <button class="btn" id="returnBtn" onclick="closeWindow()">Close & Return to Bot</button>
    </div>

    <script>
        async function verifyUserDevice() {
            // Get UID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');

            if (!uid) {
                document.getElementById("statusIcon").innerText = "❌";
                document.getElementById("statusTitle").innerText = "Error!";
                document.getElementById("statusMessage").innerText = "User ID missing. Open from Bot.";
                return;
            }

            // Create or get unique Device ID
            let deviceId = localStorage.getItem("bot_secure_device_id");
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 15);
                localStorage.setItem("bot_secure_device_id", deviceId);
            }

            // Superfast REST API directly to your Firestore Database
            const firestoreUrl = `https://firestore.googleapis.com/v1/projects/coming-886f7/databases/(default)/documents/users/${uid}?updateMask.fieldPaths=deviceId&updateMask.fieldPaths=device_verified&updateMask.fieldPaths=timestamp`;
            
            const payload = {
                fields: {
                    deviceId: { stringValue: deviceId },
                    device_verified: { booleanValue: true },
                    timestamp: { timestampValue: new Date().toISOString() }
                }
            };

            try {
                let response = await fetch(firestoreUrl, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    // Success UI
                    document.getElementById("statusIcon").innerText = "✅";
                    document.getElementById("statusTitle").innerText = "Device Verified!";
                    document.getElementById("statusTitle").style.color = "#10b981";
                    document.getElementById("statusMessage").innerText = "Success! You can now close this window and click 'I have Verified' in the bot.";
                    document.getElementById("returnBtn").style.display = "block";
                } else {
                    throw new Error("API Error");
                }
            } catch (e) {
                document.getElementById("statusIcon").innerText = "❌";
                document.getElementById("statusTitle").innerText = "Verification Failed";
                document.getElementById("statusTitle").style.color = "#ef4444";
                document.getElementById("statusMessage").innerText = "Database error. Please try again.";
                document.getElementById("returnBtn").style.display = "block";
            }
        }

        // Run instantly
        setTimeout(verifyUserDevice, 500);

        // Close App Function
        function closeWindow() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                window.close();
            }
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
