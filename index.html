<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Device Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .container { background: #1e293b; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); max-width: 400px; width: 90%; border-top: 4px solid #38bdf8; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; color: #f8fafc; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .btn { display: none; background: #10b981; color: #ffffff; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; border: none; width: 100%; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon" id="statusIcon">⏳</div>
        <h2 id="statusTitle">Verifying Device...</h2>
        <p id="statusMessage">Please wait while we securely verify your device.</p>
        <button class="btn" id="returnBtn" onclick="closeWindow()">Close & Return</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Fokyta-OqM1xQKmsoFyMsJcAfsJtftw",
            authDomain: "coming-886f7.firebaseapp.com",
            projectId: "coming-886f7",
            storageBucket: "coming-886f7.firebasestorage.app",
            messagingSenderId: "750181985724",
            appId: "1:750181985724:web:9ea95bd47645e54d774fb9",
            measurementId: "G-CXY55VR2WV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function verifyUserDevice() {
            let urlParams = new URLSearchParams(window.location.search);
            // URL मधून uid घेईल किंवा थेट तुझा Admin ID वापरेल
            let uid = urlParams.get('uid') || "7335163273";

            let deviceId = localStorage.getItem("bot_secure_device_id");
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
                localStorage.setItem("bot_secure_device_id", deviceId);
            }

            try {
                await setDoc(doc(db, "users", String(uid)), {
                    deviceId: deviceId,
                    device_verified: true,
                    timestamp: new Date().toISOString()
                }, { merge: true });

                document.getElementById("statusIcon").innerText = "✅";
                document.getElementById("statusTitle").innerText = "Device Verified!";
                document.getElementById("statusTitle").style.color = "#10b981";
                document.getElementById("statusMessage").innerText = "Your device has been verified. You can now close this window and continue.";
                document.getElementById("returnBtn").style.display = "block";
            } catch (e) {
                console.error(e);
                document.getElementById("statusIcon").innerText = "❌";
                document.getElementById("statusTitle").innerText = "Verification Failed";
                document.getElementById("statusTitle").style.color = "#ef4444";
                document.getElementById("statusMessage").innerText = "Database write error. Check Firestore rules.";
                document.getElementById("returnBtn").style.display = "block";
            }
        }

        setTimeout(verifyUserDevice, 800);

        window.closeWindow = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                window.history.back();
            }
        }
    </script>
</body>
</html>
