<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Device Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; font-family: 'Poppins', sans-serif; }
        .container { background: #1e293b; padding: 40px 30px; border-radius: 16px; width: 90%; max-width: 400px; border-top: 4px solid #38bdf8; }
        .icon { font-size: 50px; margin-bottom: 15px; }
        h2 { font-size: 24px; font-weight: 800; color: #f8fafc; }
        p { color: #94a3b8; margin: 10px 0 20px; font-size: 14px; }
        .btn { display: none; background: #10b981; color: #fff; padding: 12px; border-radius: 8px; width: 100%; border: none; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon" id="statusIcon">⏳</div>
        <h2 id="statusTitle">Verifying Device...</h2>
        <p id="statusMessage">Please wait while we securely verify your device.</p>
        <button class="btn" id="returnBtn" onclick="closeWindow()">Close & Return</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC2Fokyta-OqM1xQKmsoFyMsJcAfsJtftw",
            authDomain: "coming-886f7.firebaseapp.com",
            projectId: "coming-886f7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function verifyUserDevice() {
            const uid = new URLSearchParams(window.location.search).get('uid');
            if (!uid) return;

            let deviceId = localStorage.getItem("bot_secure_device_id") || ('dev_' + Date.now().toString(36));
            localStorage.setItem("bot_secure_device_id", deviceId);

            try {
                await setDoc(doc(db, "users", uid), {
                    deviceId: deviceId,
                    device_verified: true,
                    timestamp: new Date()
                }, { merge: true });

                document.getElementById("statusIcon").innerText = "✅";
                document.getElementById("statusTitle").innerText = "Device Verified!";
                document.getElementById("statusTitle").style.color = "#10b981";
                document.getElementById("statusMessage").innerText = "You can now close this window and click 'I have Verified' in the bot.";
                document.getElementById("returnBtn").style.display = "block";
            } catch (e) {
                alert("Error connecting to database. Make sure rules are set to true.");
            }
        }
        setTimeout(verifyUserDevice, 1000);

        window.closeWindow = function() {
            if (window.Telegram && window.Telegram.WebApp) window.Telegram.WebApp.close();
            else window.history.back();
        }
    </script>
</body>
</html>
